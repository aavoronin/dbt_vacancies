version: 2

models:
  - name: vacancy
    description: "Central fact table for vacancy scoring and attributes, partitioned by month."
    columns:
      - name: vacancy_fact_id
        description: "Auto-incrementing surrogate ID for the fact record."
      - name: vacancy_json_id
        description: "Foreign key to the raw stage.vacancy_jsons table."
      - name: saved_date_id
        description: "Date ID (YYYYMMDD) for when the vacancy was saved."
      - name: parsed_date_id
        description: "Date ID (YYYYMMDD) for when the vacancy was parsed."
      - name: file_created_date_id
        description: "Date ID (YYYYMMDD) for file system creation."
      - name: file_updated_date_id
        description: "Date ID (YYYYMMDD) for file system last update."
      - name: model_id
        description: "Foreign key to dim.models."
      - name: title_id
        description: "Foreign key to dim.titles."
      - name: level_id
        description: "Foreign key to dim.levels."
      - name: employment_type_id
        description: "Foreign key to dim.employment_types."
      - name: contract_type_id
        description: "Foreign key to dim.contract_types."
      - name: company_id
        description: "Foreign key to dim.companies."
      - name: company_industry_id
        description: "Foreign key to dim.company_industries."
      - name: vacancy_site_id
        description: "Foreign key to dim.vacancy_sites."
      - name: vacancy_id
        description: "Foreign key to dim.vacancy_ids."
      - name: score
        description: "Extracted score from the preferred estimation."
      - name: score_percentile
        description: "Extracted score percentile from the preferred estimation."
      - name: load_dttm
        description: "Timestamp of the ETL batch that last modified this record."
      - name: load_id
        description: "Foreign key to the ETL batch load."
      - name: source_id
        description: "Foreign key to the data source."
      - name: partition_key
        description: "Partition key in YYYYMM format based on saved_date."
      - name: modified_timestamp
        description: "Timestamp of the source file's last modification."
      - name: version
        description: "ETL processing version for the record."

  - name: vacancy2
    description: "1-to-1 extension fact table for vacancy URLs and file paths."
    columns:
      - name: vacancy_fact_id
        description: "FK to fact.vacancy (includes partition_key in FK)."
      - name: partition_key
        description: "Partition key in YYYYMM format (matches fact.vacancy)."
      - name: vacancy_url
        description: "Direct URL to the vacancy posting."
      - name: apply_url
        description: "Direct URL to apply for the vacancy."
      - name: json_path
        description: "Local file path to the parsed JSON file."
      - name: txt_path
        description: "Local file path to the parsed TXT file."
      - name: html_path
        description: "Local file path to the parsed HTML file."
      - name: search_url
        description: "Original search URL that led to this vacancy."

  - name: vacancy_to_skills
    description: "Many-to-many fact linking vacancies to skills with proficiency levels."
    columns:
      - name: vacancy_to_skill_id
        description: "Auto-incrementing surrogate ID."
      - name: vacancy_fact_id
        description: "FK to fact.vacancy (includes partition_key in FK)."
      - name: skill_level_id
        description: "FK to dim.skill_levels."
      - name: skill_id
        description: "FK to dim.skills."
      - name: load_dttm
        description: "Timestamp of the ETL batch that last modified this record."
      - name: load_id
        description: "Foreign key to the ETL batch load."
      - name: source_id
        description: "Foreign key to the data source."
      - name: partition_key
        description: "Partition key in YYYYMM format (matches fact.vacancy)."

  - name: vacancy_to_employer_countries
    description: "Many-to-many fact linking vacancies to employer countries."
    columns:
      - name: vacancy_to_country_id
        description: "Auto-incrementing surrogate ID."
      - name: vacancy_fact_id
        description: "FK to fact.vacancy (includes partition_key in FK)."
      - name: country_id
        description: "FK to dim.employer_countries."
      - name: load_dttm
        description: "Timestamp of the ETL batch that last modified this record."
      - name: load_id
        description: "Foreign key to the ETL batch load."
      - name: source_id
        description: "Foreign key to the data source."
      - name: partition_key
        description: "Partition key in YYYYMM format (matches fact.vacancy)."

  - name: vacancy_to_required_languages
    description: "Many-to-many fact linking vacancies to required languages."
    columns:
      - name: vacancy_to_language_id
        description: "Auto-incrementing surrogate ID."
      - name: vacancy_fact_id
        description: "FK to fact.vacancy (includes partition_key in FK)."
      - name: language_id
        description: "FK to dim.required_languages."
      - name: load_dttm
        description: "Timestamp of the ETL batch that last modified this record."
      - name: load_id
        description: "Foreign key to the ETL batch load."
      - name: source_id
        description: "Foreign key to the data source."
      - name: partition_key
        description: "Partition key in YYYYMM format (matches fact.vacancy)."

  - name: vacancy_to_certifications
    description: "Many-to-many fact linking vacancies to required certifications."
    columns:
      - name: vacancy_to_certification_id
        description: "Auto-incrementing surrogate ID."
      - name: vacancy_fact_id
        description: "FK to fact.vacancy (includes partition_key in FK)."
      - name: certification_id
        description: "FK to dim.certifications."
      - name: load_dttm
        description: "Timestamp of the ETL batch that last modified this record."
      - name: load_id
        description: "Foreign key to the ETL batch load."
      - name: source_id
        description: "Foreign key to the data source."
      - name: partition_key
        description: "Partition key in YYYYMM format (matches fact.vacancy)."

  - name: exchange_rates
    description: "Fact table for daily currency exchange rates, partitioned by month."
    columns:
      - name: exchange_rate_fact_id
        description: "Auto-incrementing surrogate ID for the fact record."
      - name: date_id
        description: "Foreign key to dict.calendar (YYYYMMDD)."
      - name: currency_id
        description: "Foreign key to dim.currencies."
      - name: rate_usd
        description: "Exchange rate to USD."
      - name: rate_eur
        description: "Exchange rate to EUR."
      - name: load_dttm
        description: "Timestamp of the ETL batch that last modified this record."
      - name: load_id
        description: "Foreign key to the ETL batch load."
      - name: source_id
        description: "Foreign key to the data source."
      - name: partition_key
        description: "Partition key in YYYYMM format based on exchange_date."
      - name: modified_timestamp
        description: "Timestamp of the source file's last modification."
      - name: version
        description: "ETL processing version for the record."