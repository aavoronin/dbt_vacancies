version: 2

models:
  - name: models
    description: "Dimension table for AI model identifiers used in estimations."
    columns:
      - name: model_id
        description: "Surrogate ID for the model."
      - name: model_name
        description: "The model identifier string."

  - name: titles
    description: "Dimension table for job titles."
    columns:
      - name: title_id
        description: "Surrogate ID for the title."
      - name: title_name
        description: "The job title string."

  - name: levels
    description: "Dimension table for seniority levels."
    columns:
      - name: level_id
        description: "Surrogate ID for the level."
      - name: level_name
        description: "The seniority level string."

  - name: employment_types
    description: "Dimension table for employment types (e.g., remote, hybrid)."
    columns:
      - name: employment_type_id
        description: "Surrogate ID for the employment type."
      - name: employment_type_name
        description: "The employment type string."

  - name: contract_types
    description: "Dimension table for contract types (e.g., permanent)."
    columns:
      - name: contract_type_id
        description: "Surrogate ID for the contract type."
      - name: contract_type_name
        description: "The contract type string."

  - name: companies
    description: "Dimension table for company names."
    columns:
      - name: company_id
        description: "Surrogate ID for the company."
      - name: company_name
        description: "The company name string."

  - name: company_industries
    description: "Dimension table for company industries."
    columns:
      - name: company_industry_id
        description: "Surrogate ID for the industry."
      - name: company_industry_name
        description: "The industry string."

  - name: vacancy_sites
    description: "Dimension table for job board sites."
    columns:
      - name: vacancy_site_id
        description: "Surrogate ID for the site."
      - name: vacancy_site_name
        description: "The job board site string."

  - name: vacancy_ids
    description: "Dimension table for unique vacancy identifiers."
    columns:
      - name: vacancy_id
        description: "Surrogate ID for the vacancy identifier."
      - name: vacancy_id_name
        description: "The vacancy identifier string extracted from the file path."

  - name: skills
    description: "Dimension table for technical skills (stored lowercase)."
    columns:
      - name: skill_id
        description: "Surrogate ID for the skill."
      - name: skill_name
        description: "The skill name (lowercase, unique)."

  - name: skill_levels
    description: "Fixed dimension of skill proficiency levels."
    columns:
      - name: skill_level_id
        description: "Surrogate ID for the skill level."
      - name: skill_level_name
        description: "The skill level name (expert, required, nice-to-have)."

  - name: employer_countries
    description: "Dimension table for employer countries (stored lowercase)."
    columns:
      - name: country_id
        description: "Surrogate ID for the country."
      - name: country_name
        description: "The country name (lowercase, unique)."

  - name: required_languages
    description: "Dimension table for required languages (stored lowercase)."
    columns:
      - name: language_id
        description: "Surrogate ID for the language."
      - name: language_name
        description: "The language name (lowercase, unique)."

  - name: certifications
    description: "Dimension table for required certifications (stored lowercase)."
    columns:
      - name: certification_id
        description: "Surrogate ID for the certification."
      - name: certification_name
        description: "The certification name (lowercase, unique)."

  - name: education_levels
    description: "Dimension table for required education levels."
    columns:
      - name: education_level_id
        description: "Surrogate ID for the education level."
      - name: education_level_name
        description: "The education level string (e.g., 'bachelor', 'master')."

  - name: company_sizes
    description: "Dimension table for company employee count ranges."
    columns:
      - name: company_size_id
        description: "Surrogate ID for the company size."
      - name: company_size_name
        description: "The company size string (e.g., '1000+', '10001+')."

  - name: currencies
    description: "Dimension table for salary and relocation currencies."
    columns:
      - name: currency_id
        description: "Surrogate ID for the currency."
      - name: currency_code
        description: "The currency code (e.g., 'USD', 'EUR', 'GBP')."

  - name: salary_periods
    description: "Dimension table for salary payment periods."
    columns:
      - name: period_id
        description: "Surrogate ID for the period."
      - name: period_name
        description: "The period name (e.g., 'year', 'month', 'hour')."

  - name: security_clearances
    description: "Dimension table for required security clearance levels."
    columns:
      - name: security_clearance_id
        description: "Surrogate ID for the security clearance."
      - name: security_clearance_name
        description: "The security clearance level string."

  - name: urgencies
    description: "Dimension table for hiring urgency levels."
    columns:
      - name: urgency_id
        description: "Surrogate ID for the urgency."
      - name: urgency_name
        description: "The urgency level string."

  - name: hiring_managers
    description: "Dimension table for hiring manager or recruiter names."
    columns:
      - name: hiring_manager_id
        description: "Surrogate ID for the hiring manager."
      - name: hiring_manager_name
        description: "The hiring manager name string."

  - name: employer_cities
    description: "Dimension table for employer cities."
    columns:
      - name: employer_city_id
        description: "Surrogate ID for the city."
      - name: employer_city_name
        description: "The city name string."

  - name: employer_states
    description: "Dimension table for employer states or regions."
    columns:
      - name: employer_state_id
        description: "Surrogate ID for the state."
      - name: employer_state_name
        description: "The state or region name string."

  - name: employer_timezones
    description: "Dimension table for employer timezones."
    columns:
      - name: employer_timezone_id
        description: "Surrogate ID for the timezone."
      - name: employer_timezone_name
        description: "The timezone string."